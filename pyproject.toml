[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter"
version = "0.1.0"
description = "CPU-only job search assistant with local LLM scoring, resume tailoring, and cover letter generation"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "dearpygui>=2.0.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "playwright>=1.45.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "lxml>=5.0.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
jobhunter = "jobhunter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
