[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter"
version = "0.2.0"
description = "Job search assistant with AI scoring, resume tailoring, and cover letter generation"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "PySide6>=6.5.0",
    "fastembed>=0.4.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "playwright>=1.45.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "lxml>=5.0.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
gemini = ["google-generativeai>=0.8.0"]
all-providers = ["anthropic>=0.40.0", "openai>=1.50.0", "google-generativeai>=0.8.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
jobhunter = "jobhunter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
